[project]
name = "tapctl"
version = "0.1.0"
description = "kubectl-style CLI for Axis Scene Metadata streaming over MQTT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Matthew Visher" }]
keywords = ["axis", "vapix", "scene-metadata", "mqtt", "physical-security", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "axelib @ git+https://github.com/oneshot2001/axelib.git",
    "click>=8.1",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "paho-mqtt>=2.0",
]

[project.scripts]
tapctl = "tapctl.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "axelib.*"
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
